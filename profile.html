<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GlowTap Customer — Profile</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@500;600;700&display=swap" />
  <style>
    :root {
      --ink: #241828;
      --muted: #7A6E78;
      --line: #EDE4EC;
      --violet: #8B00E8;
      --pink: #FF03C8;
      --grad: linear-gradient(100deg, #8B00E8 0%, #C026D3 48%, #FF03C8 100%);
      --surface: #FBF7FA;
      --phone-w: 390px;
      --phone-h: 844px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #ffffff;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      min-height: 100dvh;
      padding: 24px 16px;
      overflow: auto;
    }
    .studio {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #ffffff;
    }
    .stage {
      position: relative;
      z-index: 1;
      width: var(--phone-w);
      height: var(--phone-h);
      flex-shrink: 0;
      animation: in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    .phone {
      width: var(--phone-w);
      height: var(--phone-h);
      border-radius: 42px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 0 0 9px #171022, 0 0 0 11px #2c1a42, 0 36px 70px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .island {
      position: absolute;
      top: 11px; left: 50%;
      transform: translateX(-50%);
      width: 110px; height: 32px;
      background: #050308;
      border-radius: 20px;
      z-index: 40;
      pointer-events: none;
    }
    .status {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 52px;
      z-index: 35;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      pointer-events: none;
    }
    .status__right { display: flex; align-items: center; gap: 6px; }
    .status__right svg { display: block; width: 16px; height: 11px; }
    .status__right .status-battery { width: 25px; height: 12px; }

    .screen {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding-top: 52px;
    }

    .body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 16px 110px;
      scrollbar-width: none;
    }
    .body::-webkit-scrollbar { display: none; }

    .hero {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: var(--grad);
      padding: 20px 18px 18px !important;
      color: #fff;
      margin-bottom: 14px;
      box-shadow: 0 14px 32px rgba(139, 0, 232, 0.28);
    }
    .hero::before {
      content: "";
      position: absolute;
      width: 140px; height: 140px;
      right: -30px; top: -40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      pointer-events: none;
    }
    .hero__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .hero__avatar {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }
    .hero__avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero__edit {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      backdrop-filter: blur(8px);
    }
    .hero__edit svg { width: 14px; height: 14px; }
    .hero__name {
      margin: 14px 0 4px;
      font-family: Outfit, sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      position: relative;
      z-index: 1;
    }
    .hero__contact {
      margin: 0;
      font-size: 0.82rem;
      opacity: 0.92;
      font-weight: 500;
      position: relative;
      z-index: 1;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      position: relative;
      z-index: 1;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 0.68rem;
      font-weight: 700;
    }
    .pill svg { width: 12px; height: 12px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat {
      background: #fff;
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
      border: 1px solid rgba(139, 0, 232, 0.06);
      box-shadow: 0 4px 14px rgba(30, 42, 50, 0.04);
    }
    .stat__val {
      font-family: Outfit, sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .stat__label {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted);
      margin-top: 2px;
    }

    .hero__id {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 1;
    }
    .hero__id .hero__avatar { width: 64px; height: 64px; border-radius: 20px; }
    .hero__who { flex: 1; min-width: 0; }
    .hero__id .hero__edit { align-self: flex-start; flex-shrink: 0; }
    .hero__id .hero__name {
      margin: 0 0 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hero__id .hero__contact {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .quick__tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 4px 10px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid rgba(139, 0, 232, 0.06);
      box-shadow: 0 4px 14px rgba(30, 42, 50, 0.04);
      text-decoration: none;
      color: inherit;
    }
    .quick__tile:active { transform: scale(0.97); }
    .quick__tile .menu__icon { width: 34px; height: 34px; margin-bottom: 2px; }
    .quick__val {
      font-family: Outfit, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .quick__label { font-size: 0.66rem; font-weight: 600; color: var(--muted); }

    .fold { box-shadow: 0 6px 18px rgba(30, 42, 50, 0.04); }
    .fold__inner.menu {
      margin: 0;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    .fold.is-open .fold__inner.menu { border-top: 1px solid #F1EDF6; }

    .logout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 18px 0 6px;
      padding: 13px;
      border-radius: 16px;
      border: 1.5px solid #FECACA;
      background: #FFF5F5;
      color: #B91C1C;
      font-size: 0.86rem;
      font-weight: 700;
      text-decoration: none;
    }
    .logout svg { width: 18px; height: 18px; }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 4px 2px 8px;
    }

    .menu {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(139, 0, 232, 0.06);
      box-shadow: 0 6px 18px rgba(30, 42, 50, 0.04);
      margin-bottom: 14px;
    }
    .menu__item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      text-decoration: none;
      color: inherit;
      border: none;
      background: transparent;
      width: 100%;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      border-bottom: 1px solid #F1F5F9;
    }
    .menu__item:last-child { border-bottom: none; }
    .menu__item:active { background: #Faf8ff; }
    .menu__icon {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: #F3EEFF;
      color: var(--violet);
    }
    .menu__icon svg { width: 18px; height: 18px; }
    .menu__icon--rose { background: #FFE4EC; color: #E11D48; }
    .menu__icon--mint { background: #D1FAE5; color: #059669; }
    .menu__icon--sky { background: #DBEAFE; color: #2563EB; }
    .menu__icon--amber { background: #FFEDD5; color: #EA580C; }
    .menu__icon--slate { background: #F1F5F9; color: #475569; }
    .menu__text { flex: 1; min-width: 0; }
    .menu__title, .menu__sub { display: block; }
    .menu__sub { margin-top: 1px; }
    .menu__title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .menu__sub {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 500;
      margin-top: 1px;
    }
    .menu__chev {
      width: 16px;
      height: 16px;
      color: #C4CDD6;
      flex-shrink: 0;
    }
    .menu__item--danger .menu__title { color: #B91C1C; }
    .menu__item--danger .menu__icon {
      background: #FEF2F2;
      color: #B91C1C;
    }

    .foot {
      text-align: center;
      padding: 8px 8px 4px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 500;
    }
    .foot__more {
      margin-top: 14px;
    }
    .foot__more a {
      color: #B8A8B4;
      font-size: 0.68rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .foot__more a:active { color: var(--muted); }
    .foot strong {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      font-family: Outfit, sans-serif;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }
    .foot strong img {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      object-fit: cover;
    }

    .btn {
      height: 46px;
      border-radius: 14px;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn--ghost {
      background: #F3F0F7;
      color: var(--ink);
    }
    .btn--danger {
      background: #B91C1C;
      color: #fff;
    }

    .dock {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 22px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      width: max-content;
      max-width: calc(100% - 28px);
    }
    .tabbar {
      position: relative;
      left: auto;
      transform: none;
      bottom: auto;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: max-content;
      max-width: none;
      padding: 6px;
      background: rgba(28, 28, 30, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.2);
      box-sizing: border-box;
    }
    .tab {
      position: relative;
      display: grid;
      place-items: center;
      width: 46px;
      height: 38px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0;
      border-radius: 999px;
    }
    .tab svg { width: 22px; height: 22px; }
    .tab.is-active {
      color: #fff;
      background: rgba(255, 255, 255, 0.18);
    }
    .tab .dot {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #FF3B30;
      bottom: 7px;
      right: 10px;
      border: 1.5px solid rgba(28, 28, 30, 0.92);
    }
    .home-ind {
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 4px;
      background: rgba(30, 42, 50, 0.15);
      border-radius: 99px;
      z-index: 20;
      pointer-events: none;
    }

    @media (max-width: 430px) {
      body { padding: 0; align-items: stretch; }
      .studio, .island, .status, .home-ind { display: none; }
      .stage { width: 100%; height: 100dvh; animation: none; }
      .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
      .screen { padding-top: max(12px, env(safe-area-inset-top)); }
      .tabbar { bottom: auto; }
      .dock { bottom: max(16px, env(safe-area-inset-bottom)); }
      .body { padding-bottom: 110px; }
    }
  </style>
  <link rel="stylesheet" href="assets/app-shell.css" />
  <link rel="stylesheet" href="assets/layout.css" />
</head>
<body>
  <div class="studio" aria-hidden="true"></div>
  <div class="stage">
    <div class="phone" role="application" aria-label="GlowTap — Profile">
      <div class="island" aria-hidden="true"></div>
      <div class="status" aria-hidden="true">
        <span>9:41</span>
        <span class="status__right">
          <svg viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" rx="0.6" fill="currentColor"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="0.6" fill="currentColor"/><rect x="9" y="3" width="3" height="9" rx="0.6" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="0.6" fill="currentColor" opacity="0.35"/></svg>
          <svg viewBox="0 0 16 12"><path fill="currentColor" d="M8 9.6a1.35 1.35 0 1 1 0 2.7 1.35 1.35 0 0 1 0-2.7Zm0-3.55c1.5 0 2.88.55 3.95 1.47l-1.2 1.2A3.9 3.9 0 0 0 8 7.85c-.95 0-1.82.34-2.5.9L4.3 7.55A5.55 5.55 0 0 1 8 6.05Zm0-3.5c2.45 0 4.68.9 6.42 2.4L13.2 6.15A7.35 7.35 0 0 0 8 4.35c-2.1 0-4.02.78-5.5 2.06L1.3 5.2A9.55 9.55 0 0 1 8 2.55Z"/></svg>
          <svg class="status-battery" viewBox="0 0 28 13"><rect x="0.75" y="0.75" width="23.5" height="11.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"/><rect x="2.4" y="2.5" width="18" height="8" rx="1.2" fill="currentColor"/><path fill="currentColor" opacity="0.9" d="M25.2 4.2h1.4c.7 0 1.2.5 1.2 1.15v2.3c0 .65-.5 1.15-1.2 1.15h-1.4V4.2Z"/></svg>
        </span>
      </div>

      <div class="screen">
        <div class="body">
          <div class="hero">
            <div class="hero__id">
              <div class="hero__avatar">
                <img id="hero-avatar" src="assets/avatars/naruto.svg" alt="" />
              </div>
              <div class="hero__who">
                <h1 class="hero__name" id="hero-name">ABCD</h1>
                <p class="hero__contact" id="hero-email">abcd@gmail.com</p>
              </div>
              <a class="hero__edit" href="edit-profile.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
                Edit
              </a>
            </div>
            <div class="badges">
              <span class="pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 5 5L20 7"/></svg>
                Email &amp; phone verified
              </span>
              <span class="pill">Member since 2025</span>
            </div>
          </div>

          <div class="quick">
            <a class="quick__tile" href="bookings.html">
              <span class="menu__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5V7M16 3.5V7"/></svg>
              </span>
              <span class="quick__val">12</span>
              <span class="quick__label">Bookings</span>
            </a>
            <a class="quick__tile" href="favorites.html">
              <span class="menu__icon menu__icon--rose" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M19.5 12.6 12 20l-7.5-7.4a5 5 0 0 1 7.1-7.1l.4.4.4-.4a5 5 0 0 1 7.1 7.1Z"/></svg>
              </span>
              <span class="quick__val">4</span>
              <span class="quick__label">Favourites</span>
            </a>
            <a class="quick__tile" href="wallet.html">
              <span class="menu__icon menu__icon--amber" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>
              </span>
              <span class="quick__val" data-wallet>₹500</span>
              <span class="quick__label">Wallet</span>
            </a>
            <a class="quick__tile" href="support.html">
              <span class="menu__icon menu__icon--sky" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
              </span>
              <span class="quick__val">24×7</span>
              <span class="quick__label">Help</span>
            </a>
          </div>

          <div class="fold is-open">
            <button type="button" class="fold__head">
              <span class="fold__title">Account</span>
              <span class="fold__hint">2</span>
              <svg class="fold__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="fold__body"><div class="fold__inner menu">
              <a class="menu__item" href="change-password.html">
                <span class="menu__icon menu__icon--slate" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                </span>
                <span class="menu__text">
                  <span class="menu__title">Password &amp; security</span>
                  <span class="menu__sub">Change password</span>
                </span>
                <svg class="menu__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
              </a>
              <button type="button" class="menu__item" id="billing-open">
                <span class="menu__icon menu__icon--mint" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg>
                </span>
                <span class="menu__text">
                  <span class="menu__title">Billing address</span>
                  <span class="menu__sub" id="billing-sub">Home · Indiranagar</span>
                </span>
                <svg class="menu__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
              </button>
            </div></div>
          </div>

          <div class="fold">
            <button type="button" class="fold__head">
              <span class="fold__title">Help &amp; more</span>
              <span class="fold__hint">2</span>
              <svg class="fold__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="fold__body"><div class="fold__inner menu">
              <a class="menu__item" href="support.html">
                <span class="menu__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
                </span>
                <span class="menu__text">
                  <span class="menu__title">Help &amp; support</span>
                  <span class="menu__sub">FAQ · Contact · My tickets</span>
                </span>
                <svg class="menu__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
              </a>

  <script>
    (function () {
      var p;
      try { p = JSON.parse(localStorage.getItem('gt-profile') || 'null'); } catch (e) { p = null; }
      if (!p) return;
      if (p.name) document.getElementById('hero-name').textContent = p.name;
      if (p.email) document.getElementById('hero-email').textContent = p.email;
      if (p.avatar && /^[a-z]+$/.test(p.avatar)) document.getElementById('hero-avatar').src = 'assets/avatars/' + p.avatar + '.svg';
    })();
    (function () {
      var bal = localStorage.getItem('gt-wallet');
      if (!bal) return;
      document.querySelectorAll('[data-wallet]').forEach(function (el) {
        el.textContent = '₹' + Number(bal).toLocaleString('en-IN');
      });
    })();
  </script>
  <script src="assets/billing.js"></script>
  <script>
    (function () {
      var sub = document.getElementById('billing-sub');
      function paint() {
        var a = GTBilling.selected();
        sub.textContent = a.label + ' · ' + (a.line2 || a.line1).split(',').pop().trim() + ' – ' + a.pin;
      }
      paint();
      document.getElementById('billing-open').addEventListener('click', function () {
        GTBilling.open({ onChange: paint, useLabel: 'Set as default' });
      });
      var q = new URLSearchParams(location.search).get('billing');
      if (q) GTBilling.open({ onChange: paint, useLabel: 'Set as default', edit: q === 'new' ? 'new' : null });
    })();
  </script>
  <script src="assets/app-shell.js"></script>
