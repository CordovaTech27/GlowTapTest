<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GlowTap Customer — Ticket Detail</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" />
  <style>
    :root {
      --ink: #241828; --muted: #7A6E78; --line: #EDE4EC; --violet: #8B00E8;
      --grad: linear-gradient(100deg, #8B00E8 0%, #C026D3 48%, #FF03C8 100%);
      --surface: #FBF7FA; --phone-w: 390px; --phone-h: 844px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif; background: #ffffff; color: var(--ink);
      display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 24px 16px;
    }
    .studio { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: #ffffff; }
    .stage { position: relative; z-index: 1; width: var(--phone-w); height: var(--phone-h); }
    .phone {
      width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--surface);
      box-shadow: 0 0 0 9px #171022, 0 0 0 11px #2c1a42, 0 36px 70px rgba(0,0,0,.55);
      display: flex; flex-direction: column; position: relative;
    }
    .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 110px; height: 32px; background: #050308; border-radius: 20px; z-index: 40; pointer-events: none; }
    .status { position: absolute; top: 0; left: 0; right: 0; height: 52px; z-index: 35; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 10px; font-size: .72rem; font-weight: 600; pointer-events: none; }
    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 52px; }
    .nav { display: flex; align-items: center; gap: 10px; padding: 4px 14px 10px; background: #fff; }
    .back { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--ink); text-decoration: none; }
    .back svg { width: 18px; height: 18px; }
    .nav__meta { min-width: 0; }
    .nav h1 { margin: 0; font-family: Outfit, sans-serif; font-size: 1.05rem; font-weight: 700; }
    .nav p { margin: 1px 0 0; font-size: .72rem; color: var(--muted); font-weight: 600; }
    .body { flex: 1; overflow-y: auto; padding: 12px 16px 20px; scrollbar-width: none; }
    .body::-webkit-scrollbar { display: none; }

    .raised { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; padding: 10px 12px; border-radius: 14px; background: #ECFDF5; color: #047857; font-size: .78rem; font-weight: 600; line-height: 1.4; }
    .raised[hidden] { display: none; }
    .raised svg { width: 18px; height: 18px; flex-shrink: 0; }

    .card { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 10px; border: 1px solid rgba(139,0,232,.06); }
    .badge { display: inline-flex; padding: 4px 9px; border-radius: 999px; font-size: .68rem; font-weight: 700; margin-bottom: 8px; }
    .badge--open { background: #EEF2FF; color: #4338CA; }
    .badge--progress { background: #FFF7ED; color: #C2410C; }
    .badge--resolved { background: #ECFDF5; color: #047857; }
    .card h2 { margin: 0 0 4px; font-family: Outfit, sans-serif; font-size: 1.05rem; }
    .card__reason { margin: 0; font-size: .78rem; color: var(--muted); }
    .linked {
      display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 10px; border-radius: 12px;
      background: var(--surface); text-decoration: none; color: inherit;
    }
    .linked__thumb { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .linked__info { flex: 1; min-width: 0; }
    .linked__salon { display: block; font-size: .82rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .linked__meta { display: block; font-size: .72rem; color: var(--muted); margin-top: 1px; }
    .linked__go { font-size: .72rem; font-weight: 700; color: var(--violet); flex-shrink: 0; }
    .linked--none { color: var(--muted); font-size: .78rem; font-weight: 600; }

    .track { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 2px; }
    .track__step { position: relative; text-align: center; }
    .track__step::before {
      content: ''; position: absolute; top: 7px; left: -50%; width: 100%; height: 2px; background: var(--line);
    }
    .track__step:first-child::before { display: none; }
    .track__step.is-done::before { background: var(--violet); }
    .track__dot {
      position: relative; display: block; width: 16px; height: 16px; margin: 0 auto 6px; border-radius: 50%;
      background: #fff; border: 2px solid var(--line);
    }
    .track__step.is-done .track__dot { background: var(--violet); border-color: var(--violet); }
    .track__step.is-now .track__dot { box-shadow: 0 0 0 4px rgba(139,0,232,.15); }
    .track__name { display: block; font-size: .74rem; font-weight: 700; }
    .track__step:not(.is-done) .track__name { color: var(--muted); }
    .track__at { display: block; margin-top: 1px; font-size: .66rem; color: var(--muted); min-height: 1em; }

    .sec { margin: 16px 2px 10px; font-size: .7rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

    .msg {
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid rgba(139, 0, 232, 0.08);
    }
    .msg--you { background: #F6F0FF; border-color: rgba(139, 0, 232, 0.16); }
    .msg--care { background: #fff; }
    .msg__head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .msg__avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: .72rem; font-weight: 700; flex-shrink: 0; }
    .msg__who { margin: 0; font-size: .68rem; font-weight: 700; color: var(--muted); }
    .msg--you .msg__who { color: #6D28D9; }
    .msg__bubble { font-size: .84rem; line-height: 1.45; color: var(--ink); }
    .event { margin: 0 0 10px; }
    .event span {
      display: block;
      padding: 8px 12px;
      border-radius: 12px;
      background: #F3F0F7;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      text-align: center;
    }

    .waiting { display: flex; gap: 8px; align-items: center; margin-top: 4px; padding: 10px 12px; border-radius: 12px; font-size: .76rem; font-weight: 600; line-height: 1.4; }
    .waiting[hidden] { display: none; }
    .waiting svg { width: 16px; height: 16px; flex-shrink: 0; }
    .waiting--care { background: #F3EEFF; color: #5B21B6; }
    .waiting--you { background: #FFFBEB; color: #92400E; }

    .foot { background: #fff; border-top: 1px solid var(--line); padding: 10px 12px 14px; }
    .composer { display: flex; align-items: flex-end; gap: 8px; }
    .composer[hidden], .closed[hidden] { display: none; }
    .composer__attach, .composer__send { width: 40px; height: 40px; border-radius: 50%; border: none; display: grid; place-items: center; flex-shrink: 0; cursor: pointer; }
    .composer__attach { background: var(--surface); color: var(--muted); }
    .composer__send { background: var(--grad); color: #fff; }
    .composer__send:disabled { background: #D9D3E3; cursor: not-allowed; }
    .composer svg { width: 18px; height: 18px; }
    .composer textarea {
      flex: 1; min-height: 40px; max-height: 96px; resize: none; border: 1.5px solid #E8E4EF; border-radius: 20px;
      padding: 9px 14px; font-family: inherit; font-size: .86rem; color: var(--ink); outline: none;
    }
    .composer textarea:focus { border-color: rgba(139,0,232,.4); }
    .closed { display: flex; align-items: center; gap: 10px; }
    .closed p { flex: 1; margin: 0; font-size: .76rem; color: var(--muted); line-height: 1.4; }
    .closed__btn { padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--violet); background: #fff; color: var(--violet); font-family: inherit; font-size: .8rem; font-weight: 700; cursor: pointer; flex-shrink: 0; }

    @media (max-width: 430px) {
      body { padding: 0; align-items: stretch; }
      .studio, .island, .status { display: none; }
      .stage, .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
      .screen { padding-top: max(12px, env(safe-area-inset-top)); }
      .foot { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
    }
  </style>
  <link rel="stylesheet" href="assets/layout.css" />
  <link rel="stylesheet" href="assets/app-shell.css" />
</head>
<body>
  <div class="studio" aria-hidden="true"></div>
  <div class="stage">
    <div class="phone">
      <div class="island" aria-hidden="true"></div>
      <div class="status" aria-hidden="true"><span>9:41</span><span></span></div>
      <div class="screen">
        <div class="nav">
          <a class="back" href="tickets.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 6-6 6 6 6"/></svg></a>
          <div class="nav__meta">
            <p class="eyebrow">Support</p>
            <h1>Ticket detail</h1>
            <p id="tid">TK-2041</p>
          </div>
        </div>
        <div class="body" id="body">
          <p class="raised" id="raised" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5L20 7"/></svg>Ticket raised. GlowTap Care usually replies within 24 hours — you’ll get a notification.</p>

          <div class="card">
            <span class="badge" id="badge">In progress</span>
            <h2 id="title">Refund not reflected</h2>
            <p class="card__reason" id="reason">Payment / refund</p>
            <a class="linked" id="linked" href="booking-detail.html">
              <img class="linked__thumb" id="linked-thumb" src="" alt="" />
              <span class="linked__info"><span class="linked__salon" id="linked-salon"></span><span class="linked__meta" id="linked-meta"></span></span>
              <span class="linked__go">View</span>
            </a>
          </div>

          <div class="card">
            <div class="track" id="track"></div>
          </div>

          <p class="sec">Conversation</p>
          <div id="thread"></div>
          <p class="waiting" id="waiting" hidden></p>
        </div>
        <div class="foot">
          <form class="composer" id="composer">
            <button type="button" class="composer__attach" aria-label="Attach photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg></button>
            <textarea id="reply" rows="1" placeholder="Reply to GlowTap Care…" aria-label="Your reply"></textarea>
            <button type="submit" class="composer__send" id="send" aria-label="Send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12 20 4l-6 16-3-7-7-1Z"/></svg></button>
          </form>
          <div class="closed" id="closed" hidden>
            <p id="closed-text">This ticket was resolved. Still facing the issue?</p>
            <button type="button" class="closed__btn" id="reopen">Reopen ticket</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/tickets.js"></script>
  <script>
    (function () {
      var T = window.GTTickets;
      var params = new URLSearchParams(location.search);
      var id = T.get(params.get('id')) ? params.get('id') : 'TK-2041';
      var ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
      var ICON_REPLY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/></svg>';
      var $ = function (x) { return document.getElementById(x); };

      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
      }

      function lastAt(t, kinds) {
        for (var i = t.thread.length - 1; i >= 0; i--) {
          if (kinds.indexOf(t.thread[i].event) > -1) return t.thread[i].at.split(',')[0];
        }
        return '';
      }

      function render() {
        var t = T.get(id);
        $('tid').textContent = t.id;
        $('badge').textContent = T.STATUS[t.status];
        $('badge').className = 'badge badge--' + t.status;
        $('title').textContent = t.title;
        $('reason').textContent = t.reason;

        var b = T.booking(t.booking), linked = $('linked');
        if (b) {
          linked.href = 'booking-detail.html?id=' + b.id;
          $('linked-thumb').src = b.photo;
          $('linked-thumb').style.objectPosition = b.pos;
          $('linked-salon').textContent = b.salon;
          $('linked-meta').textContent = b.svc + ' · ' + b.when;
        } else {
          linked.outerHTML = '<p class="linked linked--none" id="linked">Not related to a booking</p>';
        }

        var order = ['open', 'progress', 'resolved'], now = order.indexOf(t.status);
        var times = { open: lastAt(t, ['open', 'reopened']), progress: lastAt(t, ['progress']), resolved: lastAt(t, ['resolved']) };
        $('track').innerHTML = order.map(function (s, i) {
          var cls = 'track__step' + (i <= now ? ' is-done' : '') + (i === now ? ' is-now' : '');
          return '<div class="' + cls + '"><span class="track__dot"></span><span class="track__name">' + T.STATUS[s] +
            '</span><span class="track__at">' + (i <= now ? esc(times[s]) : '') + '</span></div>';
        }).join('');

        $('thread').innerHTML = t.thread.map(function (m) {
          if (m.event) return '<div class="event"><span>' + T.EVENT[m.event] + ' · ' + esc(m.at) + '</span></div>';
          if (m.from === 'care') {
            return '<div class="msg msg--care"><div class="msg__head"><span class="msg__avatar">' + esc(m.name.charAt(0)) + '</span>' +
              '<p class="msg__who">' + esc(m.name) + ' · GlowTap Care · ' + esc(m.at) + '</p></div><div class="msg__bubble">' + esc(m.text) + '</div></div>';
          }
          return '<div class="msg msg--you"><p class="msg__who">You · ' + esc(m.at) + '</p><div class="msg__bubble">' + esc(m.text) + '</div></div>';
        }).join('');

        var waiting = $('waiting'), resolved = t.status === 'resolved';
        waiting.hidden = resolved;
        if (!resolved) {
          var you = t.waiting === 'you';
          waiting.className = 'waiting waiting--' + (you ? 'you' : 'care');
          waiting.innerHTML = you
            ? ICON_REPLY + 'GlowTap Care replied and is waiting for your response'
            : ICON_CLOCK + 'Waiting for GlowTap Care · usually replies within 24 hours';
        }
        $('composer').hidden = resolved;
        $('closed').hidden = !resolved;
        if (resolved) $('closed-text').textContent = 'Resolved on ' + times.resolved + '. Still facing the issue?';
      }

      var reply = $('reply'), send = $('send');
      reply.addEventListener('input', function () {
        send.disabled = !reply.value.trim();
        reply.style.height = 'auto';
        reply.style.height = reply.scrollHeight + 'px';
      });
      $('composer').addEventListener('submit', function (e) {
        e.preventDefault();
        var text = reply.value.trim();
        if (!text) return;
        T.reply(id, text);
        reply.value = '';
        reply.style.height = '';
        send.disabled = true;
        render();
        $('body').scrollTop = $('body').scrollHeight;
      });
      $('reopen').addEventListener('click', function () {
        T.reopen(id);
        render();
        $('body').scrollTop = $('body').scrollHeight;
        reply.focus();
      });

      $('raised').hidden = params.get('new') !== '1';
      render();
    })();
  </script>
  <script src="assets/app-shell.js"></script>
</body>
</html>
