<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GlowTap Customer — Category</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@500;600;700;800&display=swap" />
  <style>
    :root {
      --ink: #241828;
      --muted: #7A6E78;
      --line: #EDE4EC;
      --violet: #8B00E8;
      --pink: #FF03C8;
      --grad: linear-gradient(100deg, #8B00E8 0%, #C026D3 48%, #FF03C8 100%);
      --surface: #FBF7FA;
      --phone-w: 390px;
      --phone-h: 844px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0);
      white-space: nowrap; border: 0;
    }

    body {
      font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #ffffff;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      min-height: 100dvh;
      padding: 24px 16px;
      overflow: auto;
    }

    .studio {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #ffffff;
    }

    .stage {
      position: relative;
      z-index: 1;
      width: var(--phone-w);
      height: var(--phone-h);
      flex-shrink: 0;
      animation: in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }

    .phone {
      width: var(--phone-w);
      height: var(--phone-h);
      border-radius: 42px;
      overflow: hidden;
      background: var(--surface);
      box-shadow:
        0 0 0 9px #171022,
        0 0 0 11px #2c1a42,
        0 36px 70px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 32px;
      background: #050308;
      border-radius: 20px;
      z-index: 40;
      pointer-events: none;
    }

    .status {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 52px;
      z-index: 35;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink);
      pointer-events: none;
    }
    .status__right {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
    }
    .status__right svg {
      display: block;
      width: 16px;
      height: 11px;
      color: inherit;
    }
    .status__right .status-battery { width: 25px; height: 12px; }

    .screen {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding-top: 0;
    }

    /* —— Top bar (same as home) —— */
    .top {
      flex-shrink: 0;
      background: transparent;
      min-height: 0 !important;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: visible;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: var(--nav-row, 56px);
      overflow: visible;
    }

    .top__brand {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top__mark { display: none; }
    .top__home {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: rgba(36, 24, 40, 0.88);
      color: #fff;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(36, 24, 40, 0.16);
    }
    .top__home svg { width: 18px; height: 18px; display: block; }
    .top__meta {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .top__cat {
      margin: 0;
      font-family: Outfit, 'DM Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top__loc {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      max-width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      text-decoration: none;
      font-family: inherit;
    }
    .top__loc-badge {
      min-width: 0;
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1.2;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top__loc svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      color: var(--muted);
    }

    .top__actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(237, 228, 236, 0.9);
      box-shadow: 0 8px 22px rgba(36, 24, 40, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: visible;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--ink);
      flex-shrink: 0;
      text-decoration: none;
      transition: background 0.15s;
      overflow: visible;
      position: relative;
    }
    .icon-btn:hover,
    .icon-btn:focus-visible { background: #F6F0F7; }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn--fav { color: var(--violet); }
    .icon-btn--cart { color: var(--violet); }
    .icon-btn--wallet {
      width: auto;
      min-width: 36px;
      height: 32px;
      padding: 0 8px 0 7px;
      border-radius: 999px;
      gap: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--violet);
      background: #F3EEFF;
    }
    .icon-btn--wallet:hover,
    .icon-btn--wallet:focus-visible { background: #EDE4FF; }
    .icon-btn--wallet svg { width: 15px; height: 15px; flex-shrink: 0; }
    .icon-btn__amt {
      display: inline-block;
      max-width: 4.6em;
      color: var(--violet);
      font-family: Outfit, 'DM Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }
    .icon-btn__n {
      position: absolute;
      top: -2px;
      right: -4px;
      z-index: 2;
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      border-radius: 99px;
      background: var(--pink);
      color: #fff;
      font-family: Outfit, 'DM Sans', sans-serif;
      font-size: 0.58rem;
      font-weight: 800;
      line-height: 15px;
      text-align: center;
      display: grid;
      place-items: center;
      border: 1.5px solid #fff;
      pointer-events: none;
    }
    .icon-btn__n[hidden] { display: none; }

    .loc { margin: 2px 0 0; }
    .loc__btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(237, 228, 236, 0.95);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 6px 18px rgba(36, 24, 40, 0.05);
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      color: inherit;
      text-decoration: none;
    }
    .loc__pin {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: #F3EEFF;
      color: var(--violet);
    }
    .loc__pin svg { width: 15px; height: 15px; }
    .loc__meta { min-width: 0; flex: 1; }
    .loc__label {
      display: block;
      font-family: Outfit, sans-serif;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 2px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .loc__place {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      font-size: 0.78rem;
      line-height: 1.25;
      color: var(--muted);
      min-width: 0;
    }
    .loc__place-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .loc__chev {
      width: 16px;
      height: 16px;
      color: #B0A6AE;
      flex-shrink: 0;
    }

    /* —— Scroll body —— */
    .body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 16px 110px;
      scrollbar-width: none;
      background:
        radial-gradient(120% 70% at 100% -10%, rgba(255, 3, 200, 0.1), transparent 55%),
        radial-gradient(90% 55% at -15% 20%, rgba(139, 0, 232, 0.12), transparent 50%),
        var(--surface);
    }
    .body::-webkit-scrollbar { display: none; }

    /* —— Subcategory —— */
    .sub {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 4px;
    }

    .sub__head { display: none; }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin: -2px 0 2px;
      padding-bottom: 2px;
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.04s both;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.8);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 650;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .chip.is-on {
      border-color: transparent;
      background: var(--ink);
      color: #fff;
    }

    .popular {
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
    }
    .sec-label {
      margin: 0;
      font-family: Outfit, sans-serif;
      font-size: 0.92rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .popular__rail {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      margin: 0;
      padding: 2px 4px 6px 2px;
    }
    .popular__rail::-webkit-scrollbar { display: none; }

    a.pop {
      position: relative;
      flex: 0 0 210px;
      height: 148px;
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      background: transparent;
      scroll-snap-align: start;
      isolation: isolate;
      box-shadow: none;
      border: 0;
      transition: transform 0.18s ease;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
    }
    a.pop:active { transform: scale(0.985); }
    .pop__media {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: transparent;
    }
    .pop__media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.04);
    }
    .pop__scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, transparent 42%, rgba(0, 0, 0, 0.28) 100%);
      pointer-events: none;
    }
    .pop__body {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 4px;
      padding: 14px;
    }
    .pop__tag {
      align-self: flex-start;
      margin-bottom: auto;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .pop__shop {
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.88);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pop__name {
      font-family: Outfit, sans-serif;
      font-size: 1.05rem;
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .pop__meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.82);
    }
    .pop__off {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .promo {
      margin: 2px 0 2px;
      background: transparent;
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }
    .promo__stage {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-padding-left: 2px;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 2px 2px 6px;
      background: transparent;
    }
    .promo__stage::-webkit-scrollbar { display: none; }
    .banner {
      position: relative;
      flex: 0 0 calc(100% - 28px);
      height: 148px;
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      display: flex;
      align-items: stretch;
      background: transparent;
      box-shadow: none;
      border: 0;
      outline: 0;
      scroll-snap-align: start;
      isolation: isolate;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
    }
    .banner__art {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      overflow: hidden;
      background-color: transparent;
    }
    .banner__art::before { display: none; content: none; }
    .banner__art::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 0;
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.38) 0%, rgba(0, 0, 0, 0.12) 58%, transparent 100%);
      pointer-events: none;
    }
    .banner__wm { display: none; }
    .banner--pay .banner__art {
      background: url("assets/photos/promo-pay.jpg") center/cover no-repeat;
    }
    .banner--new .banner__art {
      background: url("assets/photos/salon-interior.jpg") center/cover no-repeat;
    }
    .banner--peak .banner__art {
      background: url("assets/photos/salon-nails.jpg") center/cover no-repeat;
    }
    .banner__content {
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      width: 100%;
      padding: 14px 14px 14px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .banner__eyebrow {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 6px;
    }
    .banner__title {
      margin: 0 0 10px;
      font-family: Outfit, 'DM Sans', sans-serif;
      font-size: 1.02rem;
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .banner__title em {
      font-style: italic;
      font-weight: 800;
      color: #FCE7F3;
    }
    .banner__cta {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .promo__dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .promo__dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      border: none;
      padding: 0;
      background: #D8CCE8;
      cursor: pointer;
      transition: width 0.2s, background 0.2s;
    }
    .promo__dot.is-active {
      width: 18px;
      background-image: var(--grad);
      background-color: #8B00E8;
    }

    .shops {
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.14s both;
    }
    .shops__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .shops__count {
      font-size: 0.74rem;
      font-weight: 650;
      color: var(--muted);
      white-space: nowrap;
    }
    .shops__list { display: flex; flex-direction: column; gap: 10px; }
    a.place {
      display: block;
      padding: 10px;
      border-radius: 18px;
      background: transparent;
      text-decoration: none;
      color: inherit;
      border: 1px solid rgba(237, 228, 236, 0.85);
      box-shadow: none;
      transition: transform 0.15s ease;
    }
    a.place:active { transform: scale(0.99); }
    .place__row { display: flex; gap: 12px; }
    .place__photo {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }
    .place__photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }
    .badge {
      position: absolute;
      top: 6px;
      left: 6px;
      max-width: calc(100% - 12px);
      padding: 2px 6px;
      border-radius: 8px;
      background: #15803D;
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .place__rate {
      margin: 3px 0 0;
      font-size: 0.72rem;
      font-weight: 700;
      color: #15803D;
    }
    .place__rate span {
      color: var(--muted);
      font-weight: 600;
    }
    .place__name {
      margin: 2px 0 0;
      font-family: Outfit, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .place__addr {
      margin: 3px 0 0;
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
    }
    .place__kind {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin: 6px 0 0;
      font-family: Outfit, sans-serif;
      font-size: 0.84rem;
      color: var(--violet);
      font-weight: 750;
    }
    .place__deal {
      display: inline-flex;
      margin: 0;
      padding: 3px 7px;
      border-radius: 999px;
      background: #F3EEF8;
      color: var(--violet);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .place__book {
      margin: 10px 0 0;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink);
    }
    .place__book.is-closed { color: var(--muted); }
    .shops__empty {
      margin: 0;
      padding: 18px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px dashed var(--line);
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
      text-align: center;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    .home-ind {
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 4px;
      background: rgba(30, 42, 50, 0.15);
      border-radius: 99px;
      z-index: 20;
      pointer-events: none;
    }

    @media (max-width: 430px) {
      body { padding: 0; align-items: stretch; }
      .studio, .island, .status, .home-ind { display: none; }
      .stage { width: 100%; height: 100dvh; animation: none; }
      .phone {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
      .screen { padding-top: max(12px, env(safe-area-inset-top)); }
      .dock { bottom: max(16px, env(safe-area-inset-bottom)); }
      .body { padding-bottom: 100px; }
    }

          '" alt="" /><span class="badge">' +
          p.rating +
          " ★</span></span>" +
          "<span><h3 class=\"place__name\">" +
          p.name +
          "</h3>" +
          '<p class="place__rate">' +
          p.rating +
          " ★ <span>(" +
          Number(p.reviews || 0).toLocaleString("en-IN") +
          " ratings)</span></p>" +
          '<p class="place__addr">' +
          p.dist +
          " · " +
          p.area +
          "</p>" +
          '<p class="place__kind">' +
          "<span>" +
          String(p.price || "").replace(/^From\s+/i, "") +
          "</span>" +
          (p.deal ? '<span class="place__deal">' + p.deal + "</span>" : "") +
          "</p>" +
          "</span></div>" +
          (p.open
            ? ""
            : '<p class="place__book is-closed">Closed · Opens at ' +
              p.slot +
              "</p>") +
          "</a>"
        );
      }

      function paintShops() {
        var rows = PLACES.filter(function (p) {
          return p.mains.split(",").indexOf(cat.key) !== -1;
        }).sort(function (a, b) {
          return a.distN - b.distN;
        });
        document.getElementById("shops-count").textContent = rows.length
          ? rows.length + " nearby"
          : "";
        document.getElementById("shops-list").innerHTML = rows.length
          ? rows.map(placeCard).join("")
          : '<p class="shops__empty">No shops for this category nearby yet.</p>';
      }

      function paintAll() {
        paintChips();
        paintPopular();
        paintShops();
      }

      document.getElementById("chips").addEventListener("click", function (e) {
        var btn = e.target.closest(".chip");
        if (!btn) return;
        activeChip = btn.getAttribute("data-chip") || "All";
        paintAll();
      });

      paintAll();

      (function () {
        var stage = document.getElementById("promo-stage");
        var dotsWrap = document.getElementById("promo-dots");
        if (!stage || !dotsWrap) return;
        var slides = Array.prototype.slice.call(stage.querySelectorAll(".banner"));
        if (!slides.length) return;
        var index = 0;
        var timer = null;
        dotsWrap.innerHTML = slides
          .map(function (_, i) {
            return (
              '<button type="button" class="promo__dot' +
              (i === 0 ? " is-active" : "") +
              '" data-i="' +
              i +
              '" aria-label="Ad ' +
              (i + 1) +
              '"></button>'
            );
          })
          .join("");
        var dots = Array.prototype.slice.call(dotsWrap.querySelectorAll(".promo__dot"));
        function go(i, smooth) {
          index = (i + slides.length) % slides.length;
          stage.scrollTo({
            left: Math.max(0, slides[index].offsetLeft - 2),
            behavior: smooth ? "smooth" : "auto",
          });
          dots.forEach(function (d, di) {
            d.classList.toggle("is-active", di === index);
          });
        }
        function restart() {
          clearInterval(timer);
          timer = setInterval(function () {
            go(index + 1, true);
          }, 4200);
        }
        dotsWrap.addEventListener("click", function (e) {
          var btn = e.target.closest(".promo__dot");
          if (!btn) return;
          go(Number(btn.getAttribute("data-i")) || 0, true);
          restart();
        });
        stage.addEventListener(
          "scroll",
          function () {
            var mid = stage.scrollLeft + stage.clientWidth * 0.4;
            var nearest = 0;
            var best = Infinity;
            slides.forEach(function (s, i) {
              var d = Math.abs(s.offsetLeft - mid + s.offsetWidth / 2);
              if (d < best) {
                best = d;
                nearest = i;
              }
            });
            if (nearest !== index) {
              index = nearest;
              dots.forEach(function (d, di) {
                d.classList.toggle("is-active", di === index);
              });
            }
          },
          { passive: true }
        );
        go(0, false);
        restart();
      })();

      (function () {
        var locBtn = document.getElementById("loc-open");
        var badge = document.getElementById("loc-badge");
        var backTo =
          "category.html?cat=" + encodeURIComponent(cat.key);
        locBtn.href =
          "location.html?from=" + encodeURIComponent(backTo);
        try {
          var saved = JSON.parse(localStorage.getItem("gt-location") || "null");
          var area =
            (saved && (saved.name || saved.area)) || "Indiranagar";
          badge.textContent = area;
          badge.title = area;
          locBtn.setAttribute(
            "aria-label",
            "Change location — " + area
          );
          locBtn.title = "Location: " + area;
        } catch (e) {}
      })();

      function paintBalance() {
        var bal = GTTopup.balance();
        document.getElementById("wallet-amt").textContent = inr(bal);
        document
          .getElementById("wallet-open")
          .setAttribute("aria-label", "Wallet balance " + inr(bal) + " — add money");
      }
      document.getElementById("wallet-open").addEventListener("click", function () {
        GTTopup.open({ onSuccess: paintBalance });
      });
      paintBalance();

      function favCount() {
        try {
          var raw = JSON.parse(localStorage.getItem("gt-favorites") || "null");
          if (Array.isArray(raw)) return raw.length;
          if (raw && typeof raw === "object") {
            var n = 0;
            if (Array.isArray(raw.salons)) n += raw.salons.length;
            if (Array.isArray(raw.stylists)) n += raw.stylists.length;
            if (Array.isArray(raw.items)) n += raw.items.length;
            return n;
          }
        } catch (err) {}
        return 0;
      }

      var cartN = window.GTCart ? GTCart.count() : 0;
      var cartBadge = document.getElementById("cart-n");
      cartBadge.hidden = false;
      cartBadge.textContent = String(cartN);
      document
        .getElementById("btn-cart")
        .setAttribute(
          "aria-label",
          "Cart, " + cartN + " service" + (cartN === 1 ? "" : "s")
        );

      var likedN = favCount();
      var favBadge = document.getElementById("fav-n");
      favBadge.hidden = false;
      favBadge.textContent = String(likedN);
      document
        .getElementById("btn-favorites")
        .setAttribute("aria-label", "Favourites, " + likedN);
    })();
  </script>
</body>
</html>
