<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>GlowTap Customer — Splash</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" />
  <style>
    :root {
      --violet: #8B00E8;
      --pink: #FF03C8;
      --ink: #171212;
      --phone-w: 390px;
      --phone-h: 844px;
    }
    * { box-sizing: border-box; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Outfit, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      background: #ffffff; color: var(--ink);
      display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 24px 16px;
    }
    .studio { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: #ffffff; }
    .stage { position: relative; z-index: 1; width: var(--phone-w); height: var(--phone-h); flex-shrink: 0; }
    .phone {
      width: 100%; height: 100%; border-radius: 42px; overflow: hidden; position: relative;
      background: #ffffff;
      box-shadow: 0 0 0 9px #171022, 0 0 0 11px #2c1a42, 0 36px 70px rgba(0,0,0,.55);
      cursor: pointer;
    }
    .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 110px; height: 32px; background: #050308; border-radius: 20px; z-index: 40; pointer-events: none; }
    .status {
      position: absolute; top: 0; left: 0; right: 0; height: 52px; z-index: 35;
      display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 10px;
      font-size: .72rem; font-weight: 600; color: var(--ink); pointer-events: none;
    }
    .status__right { display: flex; align-items: center; gap: 6px; }
    .status__right svg { display: block; width: 16px; height: 11px; }
    .status__right .status-battery { width: 25px; height: 12px; }

    .splash {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 28px 80px; text-align: center;
    }

    /* GT mark — exact SVG border cutout (no CSS crop / radius clip) */
    .mark-wrap {
      position: relative;
      width: 148px;
      /* exact GT icon cutout from 456.svg — viewBox 790×770 includes full #171212 stroke */
      height: calc(148px * 770 / 790);
      display: flex; align-items: center; justify-content: center;
      overflow: visible;
      animation: doorOpen .85s cubic-bezier(.16, 1.2, .3, 1) both;
    }
    .mark-wrap::before {
      content: ''; position: absolute; inset: -22px; border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 0, 232, .18) 0%, rgba(255, 3, 200, .08) 45%, transparent 70%);
      animation: halo 2.4s ease-in-out .7s infinite; pointer-events: none;
    }
    .mark {
      position: relative; width: 100%; height: 100%;
      overflow: visible; background: transparent; border: none; border-radius: 0;
      filter: drop-shadow(0 12px 28px rgba(139, 0, 232, .22));
    }
    .mark img {
      display: block; width: 100%; height: 100%;
      object-fit: contain; object-position: center;
    }

    /* GlowTap wordmark — brand colours from 456.svg */
    .wordmark {
      margin: 26px 0 0; font-size: 2.35rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1;
      animation: popUp .7s cubic-bezier(.16, 1.25, .3, 1) .28s both;
    }
    .wordmark__glow {
      background: linear-gradient(100deg, #8B00E8 0%, #9B3CD8 55%, #C026D3 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .wordmark__tap {
      background: linear-gradient(100deg, #C026D3 0%, #FF03C8 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .tag {
      margin: 14px 0 0; font-size: .78rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--ink);
      animation: popUp .65s cubic-bezier(.16, 1.25, .3, 1) .48s both;
    }
    .tag i { font-style: normal; opacity: .35; margin: 0 .28em; }

    .sub {
      display: flex; align-items: center; gap: 10px; margin: 18px 0 0;
      animation: popUp .65s cubic-bezier(.16, 1.25, .3, 1) .62s both;
    }
    .sub__line { width: 28px; height: 2.5px; border-radius: 99px; background: linear-gradient(90deg, #8B00E8, #9B3CD8); flex-shrink: 0; }
    .sub__line--r { background: linear-gradient(90deg, #9B3CD8, #FF03C8); }
    .sub__text {
      font-size: .62rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); white-space: nowrap;
    }

    .foot {
      position: absolute; left: 0; right: 0; bottom: 46px; display: flex; flex-direction: column; align-items: center; gap: 14px;
      animation: popUp .55s ease-out .85s both;
    }
    .bar { width: 120px; height: 4px; border-radius: 99px; background: #EFE8F5; overflow: hidden; }
    .bar b {
      display: block; height: 100%; width: 0; border-radius: 99px;
      background: linear-gradient(90deg, #8B00E8, #FF03C8);
      animation: load 2s ease-in-out .55s forwards;
    }

    @keyframes doorOpen {
      0% { opacity: 0; transform: scale(.35) rotateY(-28deg) translateY(18px); }
      60% { opacity: 1; transform: scale(1.08) rotateY(4deg) translateY(-2px); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes popUp {
      0% { opacity: 0; transform: scale(.82) translateY(22px); }
      70% { opacity: 1; transform: scale(1.04) translateY(-2px); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes halo {
      0%, 100% { opacity: .45; transform: scale(.92); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes load { to { width: 100%; } }

    .phone.is-leaving .splash,
    .phone.is-leaving .foot {
      transition: opacity .35s ease, transform .35s ease;
      opacity: 0; transform: scale(1.04);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    }
    @media (max-width: 430px) {
      body { padding: 0; align-items: stretch; }
      .studio, .island, .status { display: none; }
      .stage, .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
      .foot { bottom: max(36px, calc(env(safe-area-inset-bottom) + 20px)); }
    }
  </style>
  <link rel="stylesheet" href="assets/layout.css" />
</head>
<body>
  <div class="studio" aria-hidden="true"></div>
  <div class="stage">
    <div class="phone" id="phone" role="application" aria-label="GlowTap is loading">
      <div class="island" aria-hidden="true"></div>
      <div class="status" aria-hidden="true">
        <span>9:41</span>
        <span class="status__right">
          <svg viewBox="0 0 17 12"><rect x="0" y="8" width="3" height="4" rx="0.6" fill="currentColor"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="0.6" fill="currentColor"/><rect x="9" y="3" width="3" height="9" rx="0.6" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="0.6" fill="currentColor" opacity="0.35"/></svg>
          <svg viewBox="0 0 16 12"><path fill="currentColor" d="M8 9.6a1.35 1.35 0 1 1 0 2.7 1.35 1.35 0 0 1 0-2.7Zm0-3.55c1.5 0 2.88.55 3.95 1.47l-1.2 1.2A3.9 3.9 0 0 0 8 7.85c-.95 0-1.82.34-2.5.9L4.3 7.55A5.55 5.55 0 0 1 8 6.05Zm0-3.5c2.45 0 4.68.9 6.42 2.4L13.2 6.15A7.35 7.35 0 0 0 8 4.35c-2.1 0-4.02.78-5.5 2.06L1.3 5.2A9.55 9.55 0 0 1 8 2.55Z"/></svg>
          <svg class="status-battery" viewBox="0 0 28 13"><rect x="0.75" y="0.75" width="23.5" height="11.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.9"/><rect x="2.4" y="2.5" width="18" height="8" rx="1.2" fill="currentColor"/><path fill="currentColor" opacity="0.9" d="M25.2 4.2h1.4c.7 0 1.2.5 1.2 1.15v2.3c0 .65-.5 1.15-1.2 1.15h-1.4V4.2Z"/></svg>
        </span>
      </div>

      <main class="splash">
        <div class="mark-wrap">
          <div class="mark"><img src="assets/glowtap-icon.svg" alt="" /></div>
        </div>
        <h1 class="sr-only">GlowTap</h1>
        <p class="wordmark" aria-hidden="true"><span class="wordmark__glow">Glow</span><span class="wordmark__tap">Tap</span></p>
        <p class="tag">Tap<i>·</i>Book<i>·</i>Glow</p>
        <div class="sub" aria-hidden="true">
          <span class="sub__line"></span>
          <span class="sub__text">Unisex salon &amp; wellness</span>
          <span class="sub__line sub__line--r"></span>
        </div>
      </main>

      <div class="foot">
        <div class="bar" role="progressbar" aria-label="Loading"><b></b></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      // ?stay=1 keeps the splash on screen (review / design capture); ?next= overrides the destination.
      var params = new URLSearchParams(location.search);
      var next = params.get('next') || 'login.html';
      // stay=1 (query or #stay) keeps splash on screen for design / Figma capture
      var stay = params.get('stay') === '1' || location.hash === '#stay';
      var phone = document.getElementById('phone');
      var gone = false;
      function go() {
        if (gone || stay) return;
        gone = true;
        phone.classList.add('is-leaving');
        setTimeout(function () { location.href = next; }, 350);
      }
      phone.addEventListener('click', go);
      if (!stay) setTimeout(go, 2800);
    })();
  </script>
</body>
</html>
