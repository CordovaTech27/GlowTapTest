<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GlowTap Customer — Service</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" />
  <style>
    :root {
      --ink: #241828; --muted: #7A6E78; --line: #EDE4EC; --violet: #8B00E8; --pink: #FF03C8;
      --grad: linear-gradient(100deg, #8B00E8 0%, #C026D3 48%, #FF03C8 100%);
      --surface: #FBF7FA; --phone-w: 390px; --phone-h: 844px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif; background: #fff; color: var(--ink);
      display: flex; align-items: center; justify-content: center; min-height: 100dvh;
    }
    .stage { width: var(--phone-w); height: var(--phone-h); }
    .phone {
      width: 100%; height: 100%; background: var(--surface); display: flex; flex-direction: column;
      position: relative; overflow: hidden;
    }
    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .island {
      position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 32px; background: #050308; border-radius: 20px; z-index: 40; pointer-events: none;
    }
    .status {
      position: absolute; top: 0; left: 0; right: 0; height: 52px; z-index: 35;
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 28px 10px; font-size: .72rem; font-weight: 600; color: var(--ink); pointer-events: none;
    }
    .top {
      flex-shrink: 0; background: transparent; min-height: 0 !important;
      display: flex; flex-direction: column; gap: 8px; overflow: visible;
    }
    .brand-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: var(--nav-row, 56px); overflow: visible;
    }
    .top__brand { min-width: 0; display: flex; align-items: center; gap: 8px; }
    .top__loc {
      width: auto; height: 32px; max-width: 118px; padding: 0 8px 0 7px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      flex-shrink: 1; min-width: 0; background: #F3EEFF; color: var(--violet);
      border: 0; text-decoration: none; overflow: hidden;
    }
    .top__loc svg { width: 15px; height: 15px; flex-shrink: 0; }
    .top__loc-badge {
      max-width: 4.8em; font-family: Outfit, sans-serif; font-size: 0.68rem; font-weight: 800;
      letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .top__actions {
      display: flex; align-items: center; gap: 4px; flex-shrink: 0; padding: 4px;
      border-radius: 999px; background: rgba(255,255,255,.72);
      border: 1px solid rgba(237,228,236,.9); box-shadow: 0 8px 22px rgba(36,24,40,.06);
      overflow: visible;
    }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent;
      display: grid; place-items: center; cursor: pointer; color: var(--ink);
      flex-shrink: 0; text-decoration: none; position: relative; overflow: visible;
      font: inherit;
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn--fav, .icon-btn--cart { color: var(--violet); }
    .icon-btn--wallet {
      width: auto; min-width: 36px; height: 32px; padding: 0 8px 0 7px; border-radius: 999px;
      gap: 5px; display: inline-flex; align-items: center; justify-content: center;
      color: var(--violet); background: #F3EEFF;
    }
    .icon-btn--wallet svg { width: 15px; height: 15px; flex-shrink: 0; }
    .icon-btn__amt {
      max-width: 4.6em; font-family: Outfit, sans-serif; font-size: 0.68rem; font-weight: 800;
      letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .icon-btn__n {
      position: absolute; top: -2px; right: -4px; z-index: 2; min-width: 15px; height: 15px;
      padding: 0 4px; border-radius: 99px; background: var(--pink); color: #fff;
      font-size: 0.58rem; font-weight: 800; display: grid; place-items: center; border: 1.5px solid #fff;
    }
    .icon-btn__n[hidden] { display: none; }
    .page-head { margin: 2px 0 6px; }
    .body { flex: 1; overflow-y: auto; padding: 4px 16px 110px; scrollbar-width: none; }
    .body::-webkit-scrollbar { display: none; }
    .hscroll { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; }
    .hscroll::-webkit-scrollbar { display: none; }
    .filters { margin-bottom: 16px; }
    .filt, .plan__card {
      border: none; font-family: inherit; cursor: pointer;
    }
    .filt {
      flex: 0 0 auto; height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--line);
      background: #fff; color: var(--ink); font-size: 0.74rem; font-weight: 700;
    }
    .filt.is-on { background: var(--ink); color: #fff; border-color: transparent; }
    .filt[data-filter="open"].is-on { background: #15803D; }
    .sec { margin: 8px 0 20px; }
    .sec h2 { margin: 0 0 10px; font-family: Outfit, sans-serif; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.03em; }
    .hint { margin: -6px 0 10px; color: var(--muted); font-size: 0.75rem; font-weight: 600; }
    .sec[hidden] { display: none; }
    .place {
      display: block; padding: 10px; margin-bottom: 10px; border-radius: 18px; background: #fff;
      text-decoration: none; color: inherit; box-shadow: 0 8px 18px rgba(36, 24, 40, 0.06);
    }
    .place__row { display: flex; gap: 12px; }
    .place__photo { position: relative; width: 96px; height: 96px; flex-shrink: 0; }
    .place__photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 14px; display: block; }
    .badge {
      position: absolute; top: 6px; left: 6px; padding: 2px 6px; border-radius: 8px;
      background: #15803D; color: #fff; font-size: 0.68rem; font-weight: 700;
    }
    .place__name { margin: 2px 0 0; font-family: Outfit, sans-serif; font-size: 0.95rem; font-weight: 700; }
    .place__addr, .place__kind { margin: 3px 0 0; font-size: 0.72rem; color: var(--muted); font-weight: 600; }
    .offer {
      display: inline-flex; margin-top: 8px; padding: 4px 8px; border-radius: 999px;
      background: #F3EEF8; color: var(--violet); font-size: 0.68rem; font-weight: 700;
    }
    .place__book {
      margin: 10px 0 0; padding-top: 8px; border-top: 1px solid var(--line);
      font-size: 0.72rem; font-weight: 700;
    }
    .visit {
      display: flex; gap: 12px; height: auto; margin: 0 -16px; padding: 6px 11%;
      overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
      scrollbar-width: none; touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch;
    }
    .visit::-webkit-scrollbar { display: none; }
    .vslide {
      position: relative; left: auto; flex: 0 0 78%; height: 156px; border: none; padding: 0;
      border-radius: 18px; overflow: hidden; color: #fff; text-decoration: none; display: block;
      font-family: inherit; cursor: pointer; background: #241828;
      box-shadow: 0 12px 24px rgba(88, 0, 180, 0.18);
      scroll-snap-align: center; transform: scale(0.92); filter: blur(2.5px); opacity: 0.72;
      pointer-events: auto; transition: transform 0.35s ease, filter 0.35s ease, opacity 0.35s ease;
    }
    .vslide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .vslide span {
      position: absolute; inset: auto 0 0 0; padding: 28px 12px 12px; text-align: left;
      background: linear-gradient(180deg, transparent, rgba(16, 8, 22, 0.88));
    }
    .vslide small { display: block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.85; }
    .vslide strong { display: block; margin-top: 2px; font-family: Outfit, sans-serif; font-size: 1.02rem; }
    .vslide:not(.is-current) span { opacity: 0; }
    .vslide.is-current { transform: scale(1); filter: none; opacity: 1; z-index: 2; }
    .vslide.is-on.is-current { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #8B00E8, 0 12px 24px rgba(139, 0, 232, 0.25); }
    .spec {
      flex: 0 0 132px; padding: 10px 8px 12px; border-radius: 16px; background: #fff; text-align: center;
      text-decoration: none; color: inherit; box-shadow: 0 8px 16px rgba(36, 24, 40, 0.06);
    }
    .spec img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 8px; box-shadow: 0 0 0 2px #fff, 0 0 0 3px #E9D5FF; }
    .spec b { display: block; font-family: Outfit, sans-serif; font-size: 0.82rem; }
    .spec small { display: block; margin-top: 2px; color: var(--muted); font-size: 0.64rem; font-weight: 600; }
    .spec em { display: block; margin-top: 4px; font-style: normal; color: #15803D; font-size: 0.68rem; font-weight: 700; }
    .feature {
      display: grid; grid-template-columns: 132px 1fr; min-height: 132px; border-radius: 18px; overflow: hidden;
      background: #241828; color: #fff; text-decoration: none;
    }
    .feature img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .feature span { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 12px 14px; }
    .feature small { font-size: 0.68rem; font-weight: 700; opacity: 0.8; }
    .feature strong { font-family: Outfit, sans-serif; font-size: 1.05rem; }
    .feature em { font-style: normal; font-size: 0.72rem; font-weight: 600; opacity: 0.85; }
    .feature b {
      align-self: flex-start; margin-top: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.4);
      font-size: 0.68rem;
    }
    .offer-row {
      display: flex; gap: 10px; align-items: center; padding: 8px 0; text-decoration: none; color: inherit;
      border-bottom: 1px solid var(--line);
    }
    .offer-row img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .offer-row b { display: block; font-family: Outfit, sans-serif; font-size: 0.88rem; }
    .offer-row small { display: block; margin-top: 2px; color: var(--muted); font-size: 0.68rem; font-weight: 600; }
    .offer-row em { display: block; margin-top: 4px; font-style: normal; color: var(--violet); font-size: 0.7rem; font-weight: 700; }
    #sec-mood { margin: 2px 0 14px; }
    #sec-mood h2 { font-size: 1.02rem; margin-bottom: 8px; }
    .moods {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 6px; width: 100%;
      justify-items: center; align-items: start;
    }
    .sub {
      width: 72px; max-width: 100%; min-width: 0; border: none; background: transparent; padding: 0;
      text-align: center; cursor: pointer; font-family: inherit; color: var(--ink);
      display: flex; flex-direction: column; align-items: center;
    }
    .sub__photo, .sub__all {
      width: 60px; height: 60px; margin: 0 auto; flex-shrink: 0;
      border-radius: 14px; display: block; object-fit: cover;
    }
    .sub__all {
      position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1px;
      overflow: hidden; padding: 0; background: #fff;
    }
    .sub__all img {
      position: static; width: 100%; height: 100%; min-height: 0; object-fit: cover; display: block;
      border: 0; border-radius: 0; box-shadow: none; transform: none;
    }
    .sub__all img:nth-child(4) { display: block; }
    .sub__all-gem {
      position: absolute; z-index: 3; right: 4px; bottom: 4px; width: 12px; height: 12px; border-radius: 50%;
      background: var(--grad); box-shadow: 0 0 0 1.5px #fff;
    }
    .sub__all-gem::before {
      content: ""; position: absolute; left: 2px; top: 2px; width: 8px; height: 8px;
      background: #fff;
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    }
    .sub.is-active .sub__photo, .sub.is-active .sub__all { box-shadow: 0 0 0 2px #fff, 0 0 0 3px #8B00E8; }
    .sub__name {
      display: block; margin-top: 5px; width: 100%; min-height: 2.3em;
      font-size: 0.62rem; font-weight: 700; line-height: 1.15;
    }
    .wel { position: relative; flex: 0 0 210px; height: 132px; border-radius: 18px; overflow: hidden; display: block; text-decoration: none; color: #fff; }
    .wel img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .wel span {
      position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
      background: linear-gradient(180deg, rgba(16, 8, 22, 0.05), rgba(16, 8, 22, 0.78));
    }
    .wel small { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .wel strong { font-family: Outfit, sans-serif; font-size: 1.05rem; }
    .topc {
      flex: 0 0 168px; background: #fff; border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit;
      box-shadow: 0 8px 18px rgba(36, 24, 40, 0.06);
    }
    .topc__photo { position: relative; }
    .topc img { width: 100%; height: 108px; object-fit: cover; display: block; }
    .topc div { padding: 8px 10px 12px; }
    .topc b { display: block; font-family: Outfit, sans-serif; font-size: 0.84rem; }
    .topc small { display: block; margin-top: 3px; color: var(--muted); font-size: 0.66rem; font-weight: 600; }
    .empty { padding: 28px 8px; text-align: center; color: var(--muted); font-weight: 600; }
    /* Same 38× tab size as Home — label stays, dock height must match every other screen. */
    .phone .dock-svc {
      width: auto; min-width: 46px; height: 38px; padding: 0 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
      font-size: 0.55rem; font-weight: 700; color: #fff; background: rgba(255, 255, 255, 0.18);
      box-sizing: border-box;
    }
    .phone .dock-svc svg { width: 15px; height: 15px; }
    .phone .dock-svc span { font-size: 0.55rem; line-height: 1; letter-spacing: -0.02em; max-width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .switch {
      position: absolute; inset: 0; z-index: 50; background: rgba(20, 10, 28, 0.45);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .switch[hidden] { display: none; }
    .switch__panel {
      width: min(100%, 390px); margin: 0 auto 18px; padding: 16px 14px 18px; border-radius: 24px;
      background: #1C1C1E; color: #fff; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .switch__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pick {
      display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 92px;
      padding: 12px 6px 10px; border-radius: 16px; text-decoration: none; color: #fff;
      background: transparent; font-family: Outfit, sans-serif; font-size: 0.78rem; font-weight: 700;
    }
    .pick.is-on { background: rgba(255, 255, 255, 0.12); }
    .pick img, .pick__home {
      width: 36px; height: 36px; border-radius: 12px; object-fit: cover;
    }
    .pick__home { display: grid; place-items: center; background: rgba(255, 255, 255, 0.14); }
    .pick__home svg { width: 20px; height: 20px; }
    @media (max-width: 430px) {
      .island, .status { display: none; }
      .screen { padding-top: 0; }
    }
  </style>
  <link rel="stylesheet" href="assets/app-shell.css" />
  <link rel="stylesheet" href="assets/layout.css" />
</head>
<body>
  <div class="stage">
    <div class="phone" role="application" aria-label="GlowTap — Service">
      <div class="island" aria-hidden="true"></div>
      <div class="status" aria-hidden="true"><span>9:41</span><span></span></div>
      <div class="screen">
        <header class="top">
          <div class="brand-row">
            <div class="top__brand">
              <a class="top__loc" id="loc-open" href="location.html" title="Change location" aria-label="Change location">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
                <span class="top__loc-badge" id="loc-badge">Indiranagar</span>
              </a>
            </div>
            <div class="top__actions">
              <button type="button" class="icon-btn icon-btn--wallet" id="wallet-open" aria-label="Wallet balance ₹500 — add money" title="Wallet">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="3.5" y="7.5" width="17" height="12" rx="2.5"/><path d="M16 13.5h2"/></svg>
                <span class="icon-btn__amt" id="wallet-amt">₹500</span>
              </button>
              <a class="icon-btn icon-btn--fav" id="btn-favorites" href="favorites.html" title="Favourites" aria-label="Favourites">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12.6 12 20l-7.5-7.4a5 5 0 0 1 7.1-7.1l.4.4.4-.4a5 5 0 0 1 7.1 7.1Z"/></svg>
                <span class="icon-btn__n" id="fav-n" hidden>0</span>
              </a>
              <a class="icon-btn icon-btn--cart" id="btn-cart" href="cart.html" title="Cart" aria-label="Cart">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h2.3l2.3 11a1.7 1.7 0 0 0 1.7 1.4h8.3a1.7 1.7 0 0 0 1.7-1.3L20.6 8H5.9"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
                <span class="icon-btn__n" id="cart-n" hidden>0</span>
              </a>
            </div>
          </div>
        </header>
        <div class="body">
          <div class="page-head">
            <a class="page-head__back" id="svc-back" href="category.html" aria-label="Back">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 6-6 6 6 6"/></svg>
            </a>
            <div class="page-head__titles">
              <p class="page-head__eyebrow">Salons</p>
              <h1 class="page-head__title" id="svc-name">Salon</h1>
              <p class="page-head__sub" id="svc-sub">Browse salons near you</p>
            </div>
          </div>
          <section class="sec" id="sec-mood">
            <h2>What’s on your mind?</h2>
            <div class="moods" id="subs" role="list" aria-label="Sub services"></div>
          </section>
          <div class="hscroll filters" id="filters" role="list" aria-label="Filters">
            <button type="button" class="filt" data-filter="open">Open now</button>
            <button type="button" class="filt" data-filter="off">20% OFF &amp; above</button>
            <button type="button" class="filt" data-filter="near">Near &amp; top rated</button>
          </div>

          <section class="sec" id="sec-list">
            <h2 id="all-title">All places</h2>
            <div id="list"></div>
          </section>

          <section class="sec">
            <h2>Plan your visit</h2>
            <div class="visit" id="visit">
              <button type="button" class="vslide is-current" data-filter="off">
                <img src="assets/photos/salon-color.jpg" alt="" />
                <span><small>This week</small><strong>Up to 30% OFF</strong></span>
              </button>
              <a class="vslide is-next" id="plan-only" href="home.html">
                <img src="assets/photos/promo-pay.jpg" alt="" />
                <span><small>GlowTap</small><strong>Only on GlowTap</strong></span>
              </a>
              <button type="button" class="vslide is-prev" data-filter="near">
                <img src="assets/photos/salon-interior.jpg" alt="" />
                <span><small>Around you</small><strong>Near &amp; top rated</strong></span>
              </button>
            </div>
          </section>

          <section class="sec" id="sec-specs">
            <h2>Top specialists</h2>
            <div class="hscroll" id="specs"></div>
          </section>

          <section class="sec" id="sec-feature">
            <h2>Featured near you</h2>
            <div id="featured"></div>
          </section>

          <section class="sec" id="sec-offers">
            <h2>Offers you’ll love</h2>
            <p class="hint">The best offers at top places</p>
            <div id="offers"></div>
          </section>

          <section class="sec">
            <h2>Newly open</h2>
            <div class="hscroll" id="welcome"></div>
          </section>

          <section class="sec" id="sec-picks">
            <h2 id="picks-title">Top picks</h2>
            <div class="hscroll" id="picks"></div>
          </section>
        </div>
      </div>

      <div class="dock">
        <nav class="tabbar" aria-label="Primary">
          <button type="button" class="tab dock-svc is-active" id="dock-svc" aria-label="Services">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2 4 10v10a1 1 0 0 0 1 1h5v-6h4v6h5a1 1 0 0 0 1-1V10l-8-6.8Z"/></svg>
            <span id="dock-name">Salon</span>
          </button>
          <a class="tab" href="bookings.html" title="Bookings" aria-label="Bookings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5V7M16 3.5V7"/></svg>
          </a>
          <a class="tab" href="notifications.html" title="Alerts" aria-label="Alerts">
            <span class="dot" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 9a5.5 5.5 0 0 1 11 0c0 6.5 2.5 6.5 2.5 8.5H4c0-2 2.5-2 2.5-8.5"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
          </a>
          <a class="tab" href="profile.html" title="Profile" aria-label="Profile">

        { id: 'home', name: 'Home', href: 'home.html', photo: '' },

        { id: 'waxing', name: 'Waxing', href: 'service.html?main=waxing', photo: 'assets/photos/salon-interior.jpg' }
      ];
      var PLACES = [
        { href: 'salon-detail.html?id=bandra-glow', name: 'Luxe Curls — Indiranagar', short: 'Luxe Curls', area: 'Indiranagar', dist: '0.8 km', distN: 0.8, rating: '4.8', price: 'From ₹499', deal: '20% OFF', off: 20, photo: 'assets/photos/salon-interior.jpg', kind: 'Hair & color', open: true, slot: '10:00 AM', mains: 'salon,waxing', subs: 'haircut,hairart,color,blowdry,wax,legs' },
        { href: 'salon-detail.html?id=bloom', name: 'Bloom & Brow', short: 'Bloom & Brow', area: 'Indiranagar', dist: '1.4 km', distN: 1.4, rating: '4.6', price: 'From ₹349', deal: 'Flat ₹200 OFF', off: 0, photo: 'assets/photos/salon-facial.jpg', kind: 'Color & styling', open: true, slot: '11:30 AM', mains: 'salon,makeup', subs: 'haircut,hairart,blowdry,color,party,bridal,natural,hd' },
        { href: 'salon-detail.html?id=nord', name: 'Nord Hair Lab', short: 'Nord Hair Lab', area: 'Koramangala', dist: '2.1 km', distN: 2.1, rating: '4.9', price: 'From ₹699', deal: '', off: 0, photo: 'assets/photos/salon-mens.jpg', kind: 'Haircut & beard', open: false, slot: '10:00 AM', mains: 'salon,mens', subs: 'haircut,beard,blowdry' },
        { href: 'salon-detail.html?id=aura', name: 'Aura Spa Retreat', short: 'Aura Spa', area: 'HSR Layout', dist: '2.8 km', distN: 2.8, rating: '4.7', price: 'From ₹899', deal: '30% OFF', off: 30, photo: 'assets/photos/salon-spa.jpg', kind: 'Spa & therapy', open: true, slot: '9:30 AM', mains: 'spa', subs: 'massage,therapy,deep,stone' },
        { href: 'salon-detail.html?id=tip', name: 'Tip & Toe Nails', short: 'Tip & Toe', area: 'Indiranagar', dist: '0.5 km', distN: 0.5, rating: '4.3', price: 'From ₹299', deal: '', off: 0, photo: 'assets/photos/salon-nails.jpg', kind: 'Nails', open: true, slot: '12:00 PM', mains: 'nail', subs: 'colour,extension,art,manicure' },
        { href: 'salon-detail.html?id=velvet', name: 'Velvet Color Bar', short: 'Velvet Color Bar', area: 'Koramangala', dist: '3.2 km', distN: 3.2, rating: '4.5', price: 'From ₹1,299', deal: '15% OFF', off: 15, photo: 'assets/photos/salon-color.jpg', kind: 'Hair color', open: false, slot: '4:00 PM', mains: 'salon', subs: 'color' }
      ];

      var q = new URLSearchParams(location.search);
      var main = q.get('main') || 'salon';
      var svc = SERVICES[main];
      if (!svc) { location.replace('home.html'); return; }
      var sub = q.get('sub') || 'all';
      if (sub !== 'all' && !svc.subs.some(function (s) { return s.id === sub; })) sub = 'all';

      document.title = 'GlowTap Customer — ' + svc.name;
      document.getElementById('svc-name').textContent = svc.name;
      document.getElementById('svc-sub').textContent = 'Browse ' + svc.name.toLowerCase() + ' salons near you';
      document.getElementById('dock-name').textContent = svc.name;
      document.getElementById('dock-svc').setAttribute('aria-label', svc.name);
      document.getElementById('picks-title').textContent = svc.name + ' top picks';

      var backTo = 'service.html?main=' + encodeURIComponent(main) + (sub !== 'all' ? '&sub=' + encodeURIComponent(sub) : '');
      document.getElementById('loc-open').href = 'location.html?from=' + encodeURIComponent(backTo);
      document.getElementById('svc-back').href = 'category.html?cat=' + encodeURIComponent(main);
      var savedLoc = null;
      try { savedLoc = JSON.parse(localStorage.getItem('gt-location') || 'null'); } catch (e) {}
      if (savedLoc && savedLoc.name) {
        document.getElementById('loc-badge').textContent = savedLoc.name;
      }
      try {
        var rawFav = JSON.parse(localStorage.getItem('gt-favorites') || 'null');
        var favCount = 0;
        if (Array.isArray(rawFav)) favCount = rawFav.length;
        else if (rawFav && typeof rawFav === 'object') {
          if (Array.isArray(rawFav.salons)) favCount += rawFav.salons.length;
          if (Array.isArray(rawFav.stylists)) favCount += rawFav.stylists.length;
          if (Array.isArray(rawFav.items)) favCount += rawFav.items.length;
        }
        var favEl = document.getElementById('fav-n');
        if (favEl) {
          favEl.hidden = !favCount;
          favEl.textContent = String(favCount);
        }
      } catch (e) {}

      var filters = { open: false, off: false, near: false };
      var SPECS = [
        { name: 'Priya S.', salon: 'Luxe Curls', rating: '4.9', dist: '0.8 km', photo: 'assets/photos/stylist-1.jpg', href: 'book.html?salon=luxe&service=haircut&spec=Priya%20S.&step=1', mains: 'salon,waxing' },
        { name: 'Arjun K.', salon: 'Nord Hair Lab', rating: '4.7', dist: '2.1 km', photo: 'assets/photos/stylist-2.jpg', href: 'book.html?salon=nord&service=haircut&spec=Arjun%20K.&step=1', mains: 'salon,mens' },
        { name: 'Neha R.', salon: 'Bloom & Brow', rating: '4.8', dist: '1.4 km', photo: 'assets/photos/stylist-3.jpg', href: 'book.html?salon=bloom&service=makeup&spec=Neha%20R.&step=1', mains: 'salon,makeup' },
        { name: 'Meera D.', salon: 'Aura Spa', rating: '4.6', dist: '2.8 km', photo: 'assets/photos/stylist-4.jpg', href: 'book.html?salon=aura&service=massage&spec=Meera%20D.&step=1', mains: 'spa' },
        { name: 'Aisha M.', salon: 'Tip & Toe', rating: '4.5', dist: '0.5 km', photo: 'assets/photos/stylist-3.jpg', href: 'book.html?salon=tip&service=colour&spec=Aisha%20M.&step=1', mains: 'nail' }
      ];
      var subsEl = document.getElementById('subs');
      function allTile() {
        var photos = svc.subs.map(function (s) { return s.photo; }).slice(0, 4);
        while (photos.length < 4) photos.push(photos[0]);
        return '<span class="sub__all">' + photos.map(function (p) {
          return '<img src="' + p + '" alt="" />';
        }).join('') + '<span class="sub__all-gem" aria-hidden="true"></span></span>';
      }
      function subCard(s) {
        var on = s.id === sub ? ' is-active' : '';
        var media = s.photo
          ? '<img class="sub__photo" src="' + s.photo + '" alt="" />'
          : allTile();
        return '<button type="button" class="sub' + on + '" data-sub="' + s.id + '">' + media +
          '<span class="sub__name">' + s.label + '</span></button>';
      }
      subsEl.innerHTML = [{ id: 'all', label: 'All' }].concat(svc.subs).map(subCard).join('');
      document.getElementById('welcome').innerHTML = svc.welcome.map(function (w) {
        return '<a class="wel" href="service.html?main=' + main + '"><img src="' + w.photo + '" alt="" /><span><small>' +
          w.kicker + '</small><strong>' + w.title + '</strong></span></a>';
      }).join('');

      function rowsNow() {
        return PLACES.filter(function (p) {
          if (p.mains.split(',').indexOf(main) === -1) return false;
          if (sub !== 'all' && p.subs.split(',').indexOf(sub) === -1) return false;
          if (filters.open && !p.open) return false;
          if (filters.off && p.off < 20) return false;
          if (filters.near && (p.distN > 2 || Number(p.rating) < 4.5)) return false;
          return true;
        }).sort(function (a, b) {
          if (filters.near) return a.distN - b.distN || Number(b.rating) - Number(a.rating);
          return Number(b.rating) - Number(a.rating);
        });
      }
      function bookLine(p) {
        return p.open ? 'Bookings available from ' + p.slot + ', today' : 'Closed · Opens at ' + p.slot;
      }
      function placeCard(p) {
        return '<a class="place" href="' + p.href + '"><div class="place__row">' +
          '<span class="place__photo"><img src="' + p.photo + '" alt="" /><span class="badge">' + p.rating + ' ★</span></span>' +
          '<span><h2 class="place__name">' + p.name + '</h2>' +
          '<p class="place__addr">' + p.dist + ' · ' + p.area + '</p>' +
          '<p class="place__kind">' + p.kind + ' · ' + p.price + '</p>' +
          (p.deal ? '<span class="offer">' + p.deal + '</span>' : '') +
          '</span></div><p class="place__book">' + bookLine(p) + '</p></a>';
      }
      function paint() {
        var rows = rowsNow();
        var chosen = svc.subs.filter(function (s) { return s.id === sub; })[0];
        document.getElementById('all-title').textContent = chosen ? chosen.label : 'All ' + svc.plural;
        document.getElementById('list').innerHTML = rows.length
          ? rows.map(placeCard).join('')
          : '<p class="empty">Nothing for this yet. Try another filter.</p>';

        var deals = rows.filter(function (p) { return p.deal; });
        var featured = deals[0] || rows[0];
        document.getElementById('sec-feature').hidden = !featured;
        document.getElementById('featured').innerHTML = featured
          ? '<a class="feature" href="' + featured.href + '"><img src="' + featured.photo + '" alt="" /><span><small>' +
            featured.short + '</small><strong>' + (featured.deal || 'Top rated') + '</strong><em>' + featured.kind +
            ' near you</em><b>Explore now</b></span></a>'
          : '';
        var only = document.getElementById('plan-only');
        if (only && featured) only.href = featured.href;

        document.getElementById('sec-offers').hidden = !deals.length;
        document.getElementById('offers').innerHTML = deals.map(function (p) {
          return '<a class="offer-row" href="' + p.href + '"><img src="' + p.photo + '" alt="" /><span><b>' + p.short +
            '</b><small>' + p.rating + ' ★ · ' + p.dist + ' · ' + p.area + '</small><em>' + p.deal + '</em></span></a>';
        }).join('');

        var picks = rows.slice().sort(function (a, b) { return Number(b.rating) - Number(a.rating); }).slice(0, 4);
        document.getElementById('sec-picks').hidden = !picks.length;
        var specs = SPECS.filter(function (s) { return s.mains.split(',').indexOf(main) !== -1; });
        document.getElementById('sec-specs').hidden = !specs.length;
        document.getElementById('specs').innerHTML = specs.map(function (s) {
          return '<a class="spec" href="' + s.href + '"><img src="' + s.photo + '" alt="" /><b>' + s.name +
            '</b><small>' + s.salon + '</small><em>★ ' + s.rating + ' · ' + s.dist + '</em></a>';
        }).join('');

        var shots = svc.subs.map(function (s) { return s.photo; });
        document.querySelectorAll('#visit .vslide img').forEach(function (img, i) {
          if (shots.length) img.src = shots[i % shots.length];
        });

        document.getElementById('picks').innerHTML = picks.map(function (p) {
          return '<a class="topc" href="' + p.href + '"><span class="topc__photo"><img src="' + p.photo + '" alt="" /><span class="badge">' +
            p.rating + ' ★</span></span><div><b>' + p.short + '</b><small>' + p.dist + ' · ' + p.price.replace('From ', '') +
            '</small>' + (p.deal ? '<span class="offer">' + p.deal + '</span>' : '') + '</div></a>';
        }).join('');
      }
      paint();

      (function () {
        var stage = document.getElementById('visit');
        var slides = Array.prototype.slice.call(stage.querySelectorAll('.vslide'));
        var index = 0;
        var timer = null;
        function centerOf(slide) { return slide.offsetLeft - (stage.clientWidth - slide.offsetWidth) / 2; }
        function go(i, smooth) {
          index = (i + slides.length) % slides.length;
          stage.scrollTo({ left: Math.max(0, centerOf(slides[index])), behavior: smooth ? 'smooth' : 'auto' });
        }
        function mark() {
          var mid = stage.scrollLeft + stage.clientWidth / 2;
          var best = 0;
          var bestDist = Infinity;
          slides.forEach(function (slide, i) {
            var c = slide.offsetLeft + slide.offsetWidth / 2;
            var d = Math.abs(c - mid);
            if (d < bestDist) { bestDist = d; best = i; }
          });
          index = best;
          slides.forEach(function (slide, i) { slide.classList.toggle('is-current', i === best); });
        }
        stage.addEventListener('scroll', mark, { passive: true });
        stage.addEventListener('click', function (e) {
          var slide = e.target.closest('.vslide');
          if (!slide || slide.classList.contains('is-current')) return;
          e.preventDefault();
          e.stopPropagation();
          go(slides.indexOf(slide), true);
        });
        function arm() {
          clearInterval(timer);
          timer = setInterval(function () { go(index + 1, true); }, 3200);
        }
        stage.addEventListener('pointerdown', function () { clearInterval(timer); });
        stage.addEventListener('pointerup', arm);
        go(0, false);
        mark();
        arm();
      })();

      subsEl.addEventListener('click', function (e) {
        var btn = e.target.closest('.sub');
        if (!btn) return;
        sub = btn.getAttribute('data-sub');
        subsEl.querySelectorAll('.sub').forEach(function (el) {
          el.classList.toggle('is-active', el === btn);
        });
        var next = 'service.html?main=' + encodeURIComponent(main);
        if (sub !== 'all') next += '&sub=' + encodeURIComponent(sub);
        history.replaceState(null, '', next);
        paint();
      });

      document.querySelector('.body').addEventListener('click', function (e) {
        var chip = e.target.closest('[data-filter]');
        if (!chip) return;
        var key = chip.getAttribute('data-filter');
        filters[key] = !filters[key];
        document.querySelectorAll('[data-filter="' + key + '"]').forEach(function (el) {
          el.classList.toggle('is-on', filters[key]);
        });
        paint();
      });

      var sheet = document.getElementById('switch');
      var homeIcon = '<span class="pick__home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 4 10v10a1 1 0 0 0 1 1h5v-6h4v6h5a1 1 0 0 0 1-1V10l-8-6.8Z"/></svg></span>';
      document.getElementById('switch-grid').innerHTML = PICKS.map(function (p) {
        var on = p.id === main;
        var icon = p.photo ? '<img src="' + p.photo + '" alt="" />' : homeIcon;
        return '<a class="pick' + (on ? ' is-on' : '') + '" href="' + p.href + '">' + icon + '<span>' + p.name + '</span></a>';
      }).join('');
      document.getElementById('dock-svc').addEventListener('click', function () {
        sheet.hidden = !sheet.hidden;
      });
      sheet.addEventListener('click', function (e) {
        if (e.target === sheet) sheet.hidden = true;
      });
    })();
  </script>
  <script>
    (function () {
      function inr(n) { return '₹' + Number(n).toLocaleString('en-IN'); }
      function paintBalance() {
        var bal = window.GTTopup.balance();
        document.getElementById('wallet-amt').textContent = inr(bal);
        document.getElementById('wallet-open').setAttribute('aria-label', 'Wallet balance ' + inr(bal) + ' — add money');
      }
      document.getElementById('wallet-open').addEventListener('click', function () {
        window.GTTopup.open({ onSuccess: paintBalance });
      });
      paintBalance();
      var n = window.GTCart ? window.GTCart.count() : 0;
      var badge = document.getElementById('cart-n');
      badge.hidden = !n;
      badge.textContent = String(n);
    })();
  </script>
